name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate Version Matches Tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          MAN=$(node -p "require('./manifest.json').version")
          if [ "$PKG" != "$TAG" ] || [ "$MAN" != "$TAG" ]; then
            echo "❌ Tag $GITHUB_REF_NAME does not match package.json ($PKG) or manifest.json ($MAN)"
            exit 1
          fi
          echo "✅ Tag, package.json, and manifest.json all at version $TAG"

      - name: Production Build
        run: npm run build

      - name: Run Unit Tests
        run: npm run test
        env:
          CI: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Deep Vault ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css
